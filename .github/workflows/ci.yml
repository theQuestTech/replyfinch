name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: replyfinch
          POSTGRES_PASSWORD: replyfinch
          POSTGRES_DB: replyfinch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U replyfinch" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @replyfinch/api test
      - run: pnpm --filter @replyfinch/web test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: replyfinch
          POSTGRES_PASSWORD: replyfinch
          POSTGRES_DB: replyfinch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U replyfinch" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env && pnpm db:migrate && pnpm db:seed
      - run: pnpm --filter @replyfinch/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @replyfinch/e2e test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
